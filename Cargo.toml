[package]
name = "wart"
version = "0.1.0"
edition = "2021"
description = "Text to ASCII art, with Nerd Font symbols and gradient colors"

[build-dependencies]
# Embeds the .ico into the executable's PE resources, which is the only way
# Windows Explorer, the taskbar and the Start menu can find it.
embed-resource = "3"

[dependencies]
figlet-rs = "1.0.0"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"

egui = "0.36.2"
eframe = "0.36.2"
rfd = "0.17"
# Only text is ever put on the clipboard, so skip the default image-data
# support and the decoders it drags in.
arboard = { version = "3.6", default-features = false }
fontdue = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.151"

# egui in a debug build is slow enough to feel broken without an opt-level bump,
# and the bundled 2.5 MB font makes linking noticeably worse in debug.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
